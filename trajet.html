<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le trajet de la trame, Impact Influence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F6; --panel:#FFFFFF; --ink:#1B2430; --muted:#5B6674; --line:#D5DBE2;
  --trunk:#2A66AE; --access:#3A8A57; --serial:#D2782A; --plain:#8A94A1; --routed:#5E6B7A;
  --nat:#7747B0; --acl:#B0582A; --route:#2F7A5A; --l2:#6B7380; --host:#2D7D8C;
  --hl:#FCE7A6; --hl-ink:#5A4300; --halo:#2A66AE; --pill-ink:#FFFFFF; --bad:#B3261E;
  --dim:.28;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#18212B; --panel:#1F2A36; --ink:#E4EAF0; --muted:#9AA7B5; --line:#324150;
    --trunk:#6FA3E0; --access:#6FC08C; --serial:#EDA15A; --plain:#7F8B99; --routed:#95A3B3;
    --nat:#B391E0; --acl:#E3935F; --route:#6EC39A; --l2:#A4ADB9; --host:#6CC0CE;
    --hl:#5A4A12; --hl-ink:#FFE59A; --halo:#6FA3E0; --dim:.3; --pill-ink:#12202B; --bad:#F2867E;
  }
}
:root[data-theme="dark"]{
  --paper:#18212B; --panel:#1F2A36; --ink:#E4EAF0; --muted:#9AA7B5; --line:#324150;
  --trunk:#6FA3E0; --access:#6FC08C; --serial:#EDA15A; --plain:#7F8B99; --routed:#95A3B3;
  --nat:#B391E0; --acl:#E3935F; --route:#6EC39A; --l2:#A4ADB9; --host:#6CC0CE;
  --hl:#5A4A12; --hl-ink:#FFE59A; --halo:#6FA3E0; --dim:.3; --pill-ink:#12202B; --bad:#F2867E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--trunk);outline-offset:2px}

/* ---------- bandeau ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  border-bottom:1px solid var(--line);padding:14px 20px 12px}
.top h1{margin:0;font-size:1.3rem;line-height:1.25;font-weight:700;letter-spacing:-.005em}
.top p{margin:2px 0 10px;color:var(--muted);font-size:.95rem}
.rail{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.leg-name{font-size:.88rem;color:var(--muted);margin-right:2px}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);
  font-size:.82rem;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.dot[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot.done{border-color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:8px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:700}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- mise en page ---------- */
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);gap:0;align-items:start}
.map{padding:10px 8px 18px 12px}
.map svg{width:100%;height:auto;display:block;max-height:calc(100vh - var(--top-h,150px) - 30px)}
.side{border-left:1px solid var(--line);background:var(--panel);min-height:calc(100vh - 110px);
  padding:22px 24px 40px;position:sticky;top:var(--top-h,150px);max-height:calc(100vh - var(--top-h,150px));overflow:auto}
@media (max-width:900px){
  body{padding-bottom:84px}
  .top{position:static;padding:12px 14px 10px}
  .top p{display:none}
  .stage{grid-template-columns:1fr}
  .map{overflow-x:auto;padding:6px 0 10px;-webkit-overflow-scrolling:touch}
  .map svg{min-width:760px;max-height:none}
  .side{border-left:0;border-top:1px solid var(--line);position:static;max-height:none;min-height:0;padding:18px 16px 28px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;gap:10px;background:var(--paper);
       border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  .nav .btn{flex:1}
}

/* ---------- carte ---------- */
.lk{fill:none;stroke-linecap:round}
.lk.trunk{stroke:var(--trunk);stroke-width:3}
.lk.access{stroke:var(--access);stroke-width:2.5}
.lk.serial{stroke:var(--serial);stroke-width:3;stroke-dasharray:10 6}
.lk.routed{stroke:var(--routed);stroke-width:3}
.lk.plain{stroke:var(--plain);stroke-width:2}
.lk.off{opacity:var(--dim)}
.dev .shape{stroke-width:2}
.dev.off{opacity:var(--dim)}
.dev text{font-family:var(--font);font-size:25px;font-weight:700;fill:var(--ink)}
.dev .kind{font-size:17px;font-weight:400;fill:var(--muted)}
.dev.router .shape{fill:var(--panel);stroke:var(--ink)}
.dev.core .shape{fill:var(--panel);stroke:var(--ink);stroke-width:3.5}
.dev.distri .shape{fill:var(--panel);stroke:var(--ink)}
.dev.switch .shape{fill:var(--panel);stroke:var(--ink)}
.dev.host .shape{fill:var(--panel);stroke:var(--ink)}
.halo{fill:none;stroke:var(--halo);stroke-width:5;opacity:0}
.halo.on{opacity:1;animation:halo 1.1s ease-out 1}
@keyframes halo{from{stroke-width:14;opacity:.15}to{stroke-width:5;opacity:1}}
.flow{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:14 16;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-30}}
.cap rect{stroke-width:2}
.cap text{font-family:var(--font);font-size:24px;font-weight:700}
@media (prefers-reduced-motion:reduce){.flow{animation:none;stroke-dasharray:none}.halo.on{animation:none}}

/* ---------- panneau ---------- */
.eyebrow{color:var(--muted);font-size:.92rem;margin:0}
.side h2{margin:2px 0 4px;font-size:1.55rem;line-height:1.2}
.ports{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.pill{border-radius:999px;padding:3px 11px;font-size:.86rem;font-weight:700;color:var(--pill-ink);background:var(--l2)}
.pill.tag{background:var(--trunk)} .pill.route{background:var(--route)} .pill.acl{background:var(--acl)}
.pill.nat{background:var(--nat)} .pill.l2{background:var(--l2)} .pill.host{background:var(--host)}
.say{margin:0 0 10px}
.say b{display:inline-block;min-width:4.6em}
.note{margin:10px 0 0;color:var(--muted);font-size:.93rem;border-left:3px solid var(--line);padding-left:10px}
.frame{margin:16px 0 6px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.frame h3{margin:0;font-size:.95rem;padding:8px 12px;background:var(--paper);border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:8.6em 1fr;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);align-items:baseline}
.row:last-child{border-bottom:0}
.row .k{color:var(--muted);font-size:.9rem}
.row .v{font-family:var(--mono);font-size:.93rem;word-break:break-word}
.row.chg{background:var(--hl)}
.row.chg .v{color:var(--hl-ink);font-weight:600}
.mod{display:block;font-family:var(--font);font-size:.8rem;font-weight:700;color:var(--hl-ink)}
.intro h2{font-size:1.45rem}
.intro ul{padding-left:1.1em;margin:6px 0 14px}
.intro li{margin:0 0 6px}
.key{display:grid;grid-template-columns:36px 1fr;gap:6px 10px;align-items:center;margin:8px 0 16px;font-size:.95rem}
.sw{height:0;border-top-width:4px;border-top-style:solid}
.sw.trunk{border-color:var(--trunk)} .sw.access{border-color:var(--access)}
.sw.serial{border-color:var(--serial);border-top-style:dashed} .sw.plain{border-color:var(--plain)} .sw.routed{border-color:var(--routed)}
.recap{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.recap h3{font-size:1.02rem;margin:0 0 6px}
.recap li{margin:0 0 5px}
.kbd{font-size:.85rem;color:var(--muted);margin-top:18px}

/* ---------- version 2 ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tab{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.93rem}
.tab[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rail-dots{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.toggle{border:1.5px dashed var(--muted);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem}
.toggle[aria-pressed="true"]{border-style:solid;border-color:#B8862B;background:#F6E7C5;color:#4A3505}
:root[data-theme="dark"] .toggle[aria-pressed="true"]{background:#4A3A12;color:#FFE59A;border-color:#D9B26B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .toggle[aria-pressed="true"]{background:#4A3A12;color:#FFE59A;border-color:#D9B26B}}
.sub{margin:16px 0 4px;font-size:1.05rem}
.quiz{margin:16px 0 6px;border:1.5px dashed #B8862B;border-radius:10px;padding:12px 14px}
.quiz h3{margin:0 0 4px;font-size:1rem}
.hint{margin:0 0 10px;color:var(--muted);font-size:.9rem}
.opt{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--trunk)}
.quiz .btn{margin-top:10px}
.verdict{margin:14px 0 0;font-weight:700;border-radius:8px;padding:8px 12px}
.verdict.ok{background:color-mix(in srgb,var(--access) 18%,transparent);color:var(--ink)}
.verdict.ko{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--ink)}
.hint2{color:var(--muted);font-style:italic}
#retry{margin:8px 0 0}
[hidden]{display:none!important}
.modes{display:flex;gap:6px;margin:8px 0 10px}
.mode{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pin rect{fill:var(--panel);stroke:var(--host);stroke-width:2.5}
.pin text{font-family:var(--mono);font-size:23px;font-weight:600;fill:var(--ink)}
.pin .lead{stroke:var(--host);stroke-width:2.5;stroke-dasharray:6 6}
.clock{margin:0 0 12px;color:var(--muted);font-size:.95rem}
.req{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-style:italic}
.req span{display:block;font-style:normal;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.pre{background:color-mix(in srgb,var(--acl) 14%,transparent);border-radius:8px;padding:8px 12px}
.acts{padding-left:1.2em;margin:4px 0 12px}
.acts li{margin:0 0 8px}
.acts .w{display:block;color:var(--muted);font-size:.9rem}
.acts code{font-family:var(--mono);font-size:.92rem;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:2px 7px;display:inline-block;margin-top:2px}
.jury + .jury{margin-top:8px}
.fix li{margin:0 0 6px}
.ecart{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.ecart p{margin:0 0 6px}
.ecart span{display:block;font-size:.8rem;font-weight:700;color:var(--muted)}
.qa{border-top:1px solid var(--line);padding:10px 0}
.qq{font-weight:700;margin:0 0 6px}
.qq.big{font-size:1.2rem;line-height:1.35}
.qa-a{margin:0;padding:8px 12px;border-left:3px solid var(--access);background:var(--paper);border-radius:0 8px 8px 0}
.btn.small{padding:5px 11px;font-size:.9rem}
.goto{display:flex;flex-direction:column;gap:8px;margin-top:14px;align-items:flex-start}
.flash{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin:6px 0 10px}
.rate{display:flex;gap:10px;margin-top:12px}
.addr rect{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.addr text{font-family:var(--mono);font-size:20px;font-weight:600;fill:var(--ink)}
.chrono{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.chrono .t{font-family:var(--mono);font-size:1.15rem;font-weight:600;min-width:4.2em}
.chrono .h{color:var(--muted);font-size:.9rem}
.chrono .h.warn{color:var(--bad);font-weight:700}
.check{list-style:none;padding:0;margin:4px 0 12px}
.check li{margin:0 0 8px}
.check label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;accent-color:var(--access);flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.trap{border-left:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent);padding:8px 12px;border-radius:0 8px 8px 0;margin:0 0 8px}
.w2{display:block;color:var(--muted);font-size:.88rem}
.quote{font-weight:700}
.verify{margin:6px 0 12px;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,#B8862B 16%,transparent);font-size:.95rem}
.planwrap{overflow-x:auto;margin:4px 0 8px}
.plan{border-collapse:collapse;width:100%;font-size:.85rem}
.plan th,.plan td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.plan td:nth-child(2),.plan td:nth-child(3){font-family:var(--mono);font-size:.8rem}
.plan tr.grp td{font-weight:700;background:var(--paper);padding-top:8px}
@media (min-width:901px){
  html,body{height:100%;overflow:hidden}
  .stage{height:calc(100vh - var(--top-h,150px))}
  .map{height:100%;overflow:auto}
  .side{position:static;height:100%;max-height:none;overflow:auto}
}
.map svg#loupe{max-height:none}
.lz{stroke-width:1}
.lz.zr{fill:color-mix(in srgb,var(--ink) 4%,transparent);stroke:var(--line)}
.lz.zv{fill:color-mix(in srgb,var(--access) 9%,transparent);stroke:color-mix(in srgb,var(--access) 45%,transparent)}
.lz.zw{fill:color-mix(in srgb,var(--serial) 11%,transparent);stroke:var(--serial);stroke-dasharray:6 5}
.lzl{font-family:var(--font);font-size:13px;font-weight:700;fill:var(--muted)}
.ln rect{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.ln.l3 rect{fill:color-mix(in srgb,var(--route) 13%,var(--panel));stroke:var(--route);stroke-width:2}
.ln.cur rect{stroke:var(--trunk);stroke-width:3.5}
.lnt{font-family:var(--font);font-size:14px;font-weight:700;fill:var(--ink)}
.lns{font-family:var(--font);font-size:12px;fill:var(--muted)}
.la{stroke:var(--ink);stroke-width:2}
.la.ser{stroke:var(--serial);stroke-dasharray:7 5}
.lah{fill:var(--ink)}.lah.ser{fill:var(--serial)}
.lleader{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
.lcard{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.lcard.now{stroke:var(--trunk);stroke-width:2.5}
.lcard.fut{fill:transparent;stroke:var(--line);stroke-dasharray:5 5}
.lcard.ask{fill:color-mix(in srgb,#B8862B 10%,var(--panel));stroke:#B8862B;stroke-width:2;stroke-dasharray:6 4}
.lq{font-family:var(--font);font-size:20px;font-weight:700;fill:var(--muted)}
.lqa{font-family:var(--font);font-size:14px;font-weight:700;fill:var(--ink)}
.llab{font-family:var(--font);font-size:12px;fill:var(--muted)}
.lval{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.lchip{fill:color-mix(in srgb,var(--trunk) 18%,var(--panel));stroke:var(--trunk)}
.lchipt{font-family:var(--font);font-size:12px;font-weight:700;fill:var(--trunk)}
.ldot{fill:var(--ink)}
.lrow.dim{opacity:.16}
.lbadge rect{fill:color-mix(in srgb,var(--bad) 13%,var(--panel));stroke:var(--bad)}
.lbadge text{font-family:var(--font);font-size:12px;font-weight:700;fill:var(--bad)}
.lwhy{font-family:var(--font);font-size:12.5px;fill:var(--ink)}
.lwhyb{font-weight:700}
.layers{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 14px}
.laylab{font-size:.85rem;color:var(--muted);width:100%}
.lay{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;cursor:pointer;font-weight:700;font-size:.86rem}
.lay[aria-pressed="true"]{background:var(--trunk);border-color:var(--trunk);color:var(--pill-ink)}
.nat{margin:16px 0 6px;border:1.5px solid var(--nat);border-radius:10px;padding:10px 12px}
.nat h3{margin:0 0 6px;font-size:.98rem;color:var(--nat)}
.natrow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;padding:6px 8px;border-radius:8px;background:var(--paper)}
.natrow code{font-family:var(--mono);font-size:.88rem}
.natrow .nk{color:var(--muted);font-size:.82rem}
.natrow.new,.natrow.read{background:var(--hl)}
.natrow.new code,.natrow.read code{color:var(--hl-ink);font-weight:600}
.lval.sm{font-size:11px}
.lbadget{font-family:var(--font);font-size:12px;font-weight:700;fill:var(--bad)}
@media (max-width:900px){
  .map svg#loupe{min-width:0}
  .modes{flex-wrap:wrap}
  .mode{white-space:nowrap;font-size:.86rem;padding:6px 11px}
}
.frame.dead{border-color:var(--bad)}
.frame.dead h3{color:var(--bad)}
.frame.dead .v{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.75}
.halo.bad{stroke:var(--bad)}
.recap h3{font-size:1.02rem;margin:12px 0 6px}
.jury{margin:0;padding:10px 12px;border-left:3px solid var(--access);background:var(--paper);border-radius:0 8px 8px 0}
@media (max-width:900px){ .tabs .tab{flex:1 1 45%} }
</style>
</head>
<body>
<header class="top">
  <h1>Le trajet de la trame, dans ta maquette</h1>
  <p>Ta maquette, aux mêmes positions que dans Packet Tracer. Suis un trajet étape par étape, ou prépare ta soutenance partie par partie.</p>
  <div class="modes" role="group" aria-label="Mode">
    <button class="mode" data-mode="trajets">Les trajets</button>
    <button class="mode" data-mode="sout">La soutenance</button>
    <button class="mode" data-mode="loupe">La trame à la loupe</button>
  </div>
  <div class="tabs" id="tabs" role="group" aria-label="Choix du trajet"></div>
  <div class="tabs" id="ltabs" role="group" aria-label="Choix de la phase" hidden></div>
  <div class="rail">
    <div id="rail" class="rail-dots" role="group" aria-label="Étapes du trajet"></div>
    <button class="toggle" id="train" aria-pressed="false">Mode entraînement</button>
    <button class="toggle" id="addrBtn" aria-pressed="false">Adresses sur la carte</button>
    <div class="nav">
      <button class="btn" id="prev">Étape précédente</button>
      <button class="btn primary" id="next">Étape suivante</button>
    </div>
  </div>
  <div class="chrono" id="chrono" hidden><span class="t" id="chT">00:00</span><button class="btn small" id="chGo">Démarrer le chronomètre</button><button class="btn small" id="chRz">Remettre à zéro</button><span class="h" id="chH"></span></div>
</header>
<main class="stage">
  <div class="map"><svg id="map" role="img" aria-label="Topologie de la maquette Impact Influence"></svg><svg id="loupe" role="img" aria-label="La trame à la loupe" hidden></svg></div>
  <aside class="side" id="side" aria-live="polite"></aside>

const el=(t,a={},p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const gLinks=el('g'), gFlow=el('g'), gDev=el('g'), gCap=el('g');

  (linkEls[linkKey(l.a,l.b)]=linkEls[linkKey(l.a,l.b)]||[]).push(line);
});
(()=>{const A=pos['DISTRI-GAUCHE'],B=pos['DISTRI-DROITE'];

TOPO.devices.forEach(d=>{
  const g=el('g',{class:'dev '+d.k,'data-n':d.n},gDev);
  const halo=el('circle',{cx:d.x,cy:d.y,r:d.k==='host'?40:48,class:'halo'},g);
  if(d.k==='router') el('circle',{cx:d.x,cy:d.y,r:30,class:'shape'},g);
  else if(d.k==='core') el('rect',{x:d.x-50,y:d.y-26,width:100,height:52,rx:10,class:'shape'},g);

const DIRNAME={aller:"Aller",retour:"Retour",trajet:"Trajet"};
function buildRail(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  const b0=document.createElement('button'); b0.className='dot'; b0.dataset.step=0; b0.textContent='0';
  b0.setAttribute('aria-label','Départ'); rail.appendChild(b0);
  const groups=[...new Set(sc().steps.map(s=>s.dir))];
  groups.forEach(g=>{
    const w=document.createElement('div'); w.className='leg';
    const lab=document.createElement('span'); lab.className='leg-name'; lab.textContent=DIRNAME[g]; w.appendChild(lab);
    sc().steps.filter(s=>s.dir===g).forEach(s=>{const b=document.createElement('button');b.className='dot';b.dataset.step=s.n;b.textContent=s.n;
      b.setAttribute('aria-label',`Étape ${s.n}, ${s.title}`);w.appendChild(b);});
    rail.appendChild(w);
  });

function renderTrajet(){
  const st=sc().steps, cur=st[step-1];
  const PATH=new Set(st.map(s=>s.dev));
  document.querySelectorAll('.tab').forEach((b,i)=>b.setAttribute('aria-pressed',i===si?'true':'false'));
  trainBtn.setAttribute('aria-pressed',train?'true':'false');
  trainBtn.textContent = train ? 'Mode entraînement activé' : 'Mode entraînement';
  // carte
  Object.entries(devEls).forEach(([n,o])=>{ o.g.classList.toggle('off', step>0 && !PATH.has(n)); o.halo.classList.remove('on','bad'); });
  Object.values(linkEls).flat().forEach(l=>l.classList.toggle('off', step>0));
  if(step>0) st.forEach(s=>{ if(s.next) (linkEls[linkKey(s.dev,s.next)]||[]).forEach(l=>l.classList.remove('off')); });
  gFlow.innerHTML=''; gCap.innerHTML='';
  if(cur){
    const h=devEls[cur.dev].halo; void h.getBoundingClientRect(); h.classList.add('on'); if(cur.dropped) h.classList.add('bad');
    if(cur.next){
      const A=pos[cur.dev], B=pos[cur.next];
      const col = cur.serial ? 'var(--serial)' : (cur.cap.startsWith('étiquette') ? 'var(--trunk)' : 'var(--ink)');
      const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, px=-uy, py=ux;
      const x1=A.x+ux*48, y1=A.y+uy*48, x2=B.x-ux*58, y2=B.y-uy*58;
      el('line',{x1,y1,x2,y2,stroke:col,'stroke-width':'7','stroke-linecap':'round',opacity:'.22'},gFlow);
      el('line',{x1,y1,x2:x2-ux*14,y2:y2-uy*14,class:'flow',stroke:col},gFlow);
      const bx=x2-ux*26, by=y2-uy*26;
      el('polygon',{points:`${x2},${y2} ${bx+px*13},${by+py*13} ${bx-px*13},${by-py*13}`,fill:col},gFlow);
      capsule(cur.cap, col, x1,y1,x2,y2, px,py);
    } else if(cur.dropped){
      const A=pos[cur.dev];
      capsule('détruit par la liste 100','var(--bad)', A.x-40,A.y, A.x+40,A.y, 0,1, 70);
    }
  }
  // rail
  document.querySelectorAll('#rail .dot').forEach(b=>{const n=+b.dataset.step;
    b.removeAttribute('aria-current'); if(n===step) b.setAttribute('aria-current','step'); b.classList.toggle('done', n<step);});
  document.getElementById('prev').disabled = step===0; document.getElementById('prev').textContent='Étape précédente';
  const nx=document.getElementById('next'); nx.disabled = step===last();
  const nextStep=st[step]; 
  nx.textContent = step===0 ? 'Commencer le trajet' : (cur && nextStep && cur.dir!==nextStep.dir ? 'Commencer le retour' : 'Étape suivante');
  document.getElementById('side').innerHTML = step===0 ? introHTML() : stepHTML(cur);
  bindQuiz(cur);
  // petit ecran : recentrer la carte
  if(cur){ const box=document.querySelector('.map'); if(box.scrollWidth>box.clientWidth){
    const vb=svg.viewBox.baseVal, pxl=(pos[cur.dev].x-vb.x)/vb.width*svg.clientWidth;
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    box.scrollTo({left:Math.max(0,pxl-box.clientWidth/2),behavior:reduce?'auto':'smooth'}); } }
  try{localStorage.setItem('trajet-v2',JSON.stringify({si,step,train}));}catch(e){}
  setTop();
}

function capsule(text,col,x1,y1,x2,y2,px,py,forceOff){
  const g=el('g',{class:'cap'},gCap);
  const txt=el('text',{x:0,y:0,'text-anchor':'middle',fill:col},g); txt.textContent=text;
  const w=txt.getComputedTextLength()+30, hh=20;
  const sgn=(px>0?1:-1), off=forceOff||(Math.abs(px)*(w/2)+Math.abs(py)*hh+14);
  const mx=x1+(x2-x1)*.5+px*sgn*off, my=y1+(y2-y1)*.5+py*sgn*off;
  txt.setAttribute('x',mx); txt.setAttribute('y',my+8);
  const r=el('rect',{x:mx-w/2,y:my-hh,width:w,height:hh*2,rx:hh,fill:'var(--panel)',stroke:col},g);
  g.insertBefore(r,txt);
}

function quizzable(s){ return train && !s.created && !s.arrival && !s.dropped; }

function stepHTML(s){
  const key=`${si}:${s.n}`, ans=answered[key];
  const hide = quizzable(s) && !ans;
  const pills = hide ? '' : s.pills.map(([k,t])=>`<span class="pill ${k}">${t}</span>`).join('');
  const say = hide ? `<p class="say hint2">Regarde la carte : par quel type de câble la trame arrive-t-elle ici, et par lequel repart-elle ? L'équipement lit-il seulement l'adresse matérielle, ou aussi l'IP ?</p>`
                   : s.say.map(([k,t])=>`<p class="say"><b>${k}</b> ${t}</p>`).join('');
  let frame='';
  if(quizzable(s) && !ans){
    frame=`<div class="quiz"><h3>À toi : quels champs de la trame vont changer ici ?</h3>
      <p class="hint">Coche les champs modifiés. Si rien ne change, ne coche rien.</p>
      ${FIELDS.map(k=>`<label class="opt"><input type="checkbox" value="${k}"> ${LABELS[k]}</label>`).join('')}
      <button class="btn primary" id="check">Vérifier ma réponse</button></div>`;
  } else {
    const where = s.dropped ? 'Le paquet est détruit ici' : s.arrival ? 'La trame reçue' : (s.created ? 'La trame créée ici' : 'La trame en sortie de cet équipement');
    const rows=FIELDS.map(k=>{ const chg=s.chg.includes(k)&&!s.created;
      return `<div class="row${chg?' chg':''}"><span class="k">${LABELS[k]}${chg?'<span class="mod">modifié ici</span>':''}</span><span class="v">${s.f[k]}</span></div>`;}).join('');
    let verdict='';
    if(ans){
      const good=new Set(s.chg), pick=new Set(ans.picked);
      const miss=[...good].filter(k=>!pick.has(k)).map(k=>LABELS[k]), extra=[...pick].filter(k=>!good.has(k)).map(k=>LABELS[k]);
      verdict = ans.ok ? `<p class="verdict ok">Exact. ${good.size?'':'Rien ne change à cette étape.'}</p>`
        : `<p class="verdict ko">Pas tout à fait.${miss.length?` Tu as oublié : ${miss.join(', ')}.`:''}${extra.length?` En trop : ${extra.join(', ')}.`:''}</p><button class="btn" id="retry">Réessayer cette étape</button>`;
    }
    const nothing=(!s.created && !s.dropped && s.chg.length===0) ? `<p class="note">Rien ne change dans la trame à cette étape.</p>` : '';
    frame=`${verdict}<div class="frame${s.dropped?' dead':''}"><h3>${where}</h3>${rows}</div>${nothing}`;
  }
  const end = s.n===last() ? `<div class="recap"><h3>Ce qu'il faut retenir</h3><ul>${sc().retain.map(r=>`<li>${r}</li>`).join('')}</ul>
      <h3>Pour le jury</h3><p class="jury">${sc().jury}</p></div>` : '';
  const dirTxt = s.dir==='trajet' ? '' : (s.dir==='aller'?'Aller, ':'Retour, ');
  return `<p class="eyebrow">${dirTxt ? dirTxt+'étape' : 'Étape'} ${s.n} sur ${last()}</p>
  <h2>${s.title}</h2><p class="ports">${s.ports}</p><div class="pills">${pills}</div>${say}
  ${frame}${s.note && !hide ?`<p class="note">${s.note}</p>`:''}${end}`;
}

function bindQuiz(s){
  const r=document.getElementById('retry');
  if(r&&s) r.addEventListener('click',()=>{ delete answered[`${si}:${s.n}`]; render(); });
  const b=document.getElementById('check'); if(!b||!s) return;
  b.addEventListener('click',()=>{
    const picked=[...document.querySelectorAll('.quiz input:checked')].map(i=>i.value);
    const good=new Set(s.chg); const ok=picked.length===good.size && picked.every(k=>good.has(k));
    answered[`${si}:${s.n}`]={picked,ok}; render();
  });
}

function render(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false'));

  const navKey = mode==='sout' ? 's'+card : mode==='loupe' ? 'l'+lphase+':'+lstep : 't'+si+':'+step;
  if(navKey!==window.__navKey){ window.__navKey=navKey; document.getElementById('side').scrollTop=0;
  }
  if(window.innerWidth>900){ window.scrollTo(0,0); document.body.scrollTop=0; document.documentElement.scrollTop=0; }
  drawAddr(); setTop();
}

const QUIZ = [
 {q:"Pourquoi trois architectures différentes selon les bâtiments ?", a:"J'ai concentré la complexité là où elle se justifie. Le siège a cinq services : trois niveaux, des VLAN, du filtrage. Le Bleu et le Vert ont deux salles, déjà séparées par deux interfaces du routeur : ils sont plats.", hl:["Rouge","Bleu","Vert","CORE-L3"]},
 {q:"Pourquoi un /30 sur les liaisons entre routeurs ?", a:"Une liaison ne relie que deux routeurs : deux adresses utilisables, plus l'adresse de réseau et la diffusion. Quatre adresses, donc deux bits, donc un /30.", hl:["Rouge","Bleu","Vert"]},
 {q:"Pourquoi un /24 à l'intérieur des bâtiments ?", a:"Pour la marge, afin qu'un service grandisse sans refaire l'adressage, et pour la lisibilité : le numéro du VLAN se retrouve dans le troisième octet.", hl:["CORE-L3"]},
 {q:"Pourquoi OSPF plutôt que des routes statiques ?", a:"Avec trois sites en triangle, OSPF détecte une coupure et recalcule un chemin par l'autre côté. Une route statique ne le fera jamais.", hl:["Rouge","Bleu","Vert"]},
 {q:"Pourquoi des routes statiques sur le routeur Rouge ?", a:"Les VLAN sont derrière le cœur, pas sur le routeur. Six routes statiques les lui apprennent, et la redistribution les annonce aux autres bâtiments.", hl:["Rouge","CORE-L3"]},
 {q:"Qu'est-ce qu'un trunk, et quand l'étiquette est-elle posée ?", a:"Un lien qui transporte plusieurs VLAN, chaque trame portant l'étiquette de son VLAN. Elle est posée quand la trame sort par un port trunk, et retirée quand elle sort vers un poste.", hl:["SW-FINANCE","DISTRI-GAUCHE","CORE-L3"]},
 {q:"Pourquoi le DHCP est-il sur le cœur ?", a:"Une demande d'adresse est une diffusion, qui ne franchit pas un VLAN. Le cœur est présent dans chaque VLAN : il reçoit toutes les demandes sans relais.", hl:["CORE-L3"]},
 {q:"Qui route entre la Finance et la Direction ?", a:"Le switch de cœur, grâce à ses interfaces virtuelles. Aucun routeur n'intervient, et les adresses IP ne changent pas.", hl:["CORE-L3","FINANCE","DIRECTION"]},
 {q:"Où se fait le NAT, et que fait-il au retour ?", a:"Sur le routeur Rouge. À l'aller, il remplace l'expéditeur par son adresse publique et note la ligne dans sa table. Au retour, il retrouve la ligne grâce au numéro de port et remplace le destinataire.", hl:["Rouge"]},
 {q:"Pourquoi avoir retiré le NAT statique ?", a:"Il réécrivait l'adresse de la réponse du serveur : le poste recevait une réponse d'une adresse qu'il n'avait pas interrogée, et la rejetait. Or l'objectif était que les postes accèdent au serveur web.", hl:["Vert","SRV-WEB"]},
 {q:"Vos listes du cœur fonctionnent-elles ?", a:"Non : elles sont écrites mais pas appliquées, et show ip interface le montre. Telles quelles, elles auraient trois défauts : elles bloqueraient les réponses vers l'Informatique, les pings vers les routeurs et les demandes DHCP.", hl:["CORE-L3"]},

 {q:"Quelle différence entre LACP et la topologie en V ?", a:"LACP regroupe des câbles parallèles vers le même équipement, contre la rupture d'un câble. La topologie en V relie chaque switch d'accès aux deux distributions, contre la panne d'un équipement.", hl:["DISTRI-GAUCHE","DISTRI-DROITE"]},

function buildSoutRail(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  const numbered=SOUT.filter(x=>x.part!=='avant');
  [["avant","Avant"],["presentation","Présentation, 15 min"],["discussion","Discussion"]].forEach(([p,lab])=>{
    const w=document.createElement('div'); w.className='leg';
    const l=document.createElement('span'); l.className='leg-name'; l.textContent=lab; w.appendChild(l);
    SOUT.forEach((c,i)=>{ if(c.part!==p) return; const b=document.createElement('button'); b.className='dot';
      const lbl=c.part==='avant'?'J':String(numbered.indexOf(c)+1);
      b.dataset.card=i+1; b.textContent=lbl; b.setAttribute('aria-label',`Partie ${lbl}, ${c.title}`);
      b.addEventListener('click',()=>{card=i+1;render();}); w.appendChild(b); });
    rail.appendChild(w);
  });

function pin(x,y,text,tx,ty){
  const vb=svg.viewBox.baseVal;
  const g=el('g',{class:'pin'},gCap);
  if(tx!==undefined) el('line',{x1:x,y1:y,x2:tx,y2:ty,class:'lead'},g);
  const t=el('text',{x:0,y:0,'text-anchor':'middle'},g); t.textContent=text;
  const w=t.getComputedTextLength()+30, hh=20;
  x=Math.max(vb.x+w/2+8,Math.min(vb.x+vb.width-w/2-8,x));
  t.setAttribute('x',x); t.setAttribute('y',y+8);
  const r=el('rect',{x:x-w/2,y:y-hh,width:w,height:hh*2,rx:8},g); g.insertBefore(r,t);
}

function renderSout(){
  const c=SOUT[card-1];
  let on;
  if(c.id==='quiz'){ const q=QUIZ[qorder[qpos]]; on=new Set(q?q.hl:Object.keys(devEls)); }
  else on=new Set(c.hl.all?Object.keys(devEls):c.hl.devs);
  const pairs=new Set((c.hl.pairs||[]).map(p=>linkKey(p[0],p[1])));
  Object.entries(devEls).forEach(([n,o])=>{ o.g.classList.toggle('off',!on.has(n)); o.halo.classList.remove('on','bad'); });
  Object.entries(linkEls).forEach(([k,ls])=>{
    const [a,b]=k.split('|');
    let lit = c.hl.all && c.id!=='quiz' ? true
      : c.id==='quiz' ? (on.has(a)&&on.has(b))
      : pairs.size ? pairs.has(k)
      : (c.hl.kinds||[]).includes(linkKind[k]) && on.has(a) && on.has(b);
    ls.forEach(l=>l.classList.toggle('off',!lit));
  });
  gFlow.innerHTML=''; gCap.innerHTML='';
  (addrOn && c.id==='adr' ? [] : (c.pins||[])).forEach(p=>{
    let tx,ty;
    if(p.dev){ tx=pos[p.dev].x; ty=pos[p.dev].y; devEls[p.dev].halo.classList.add('on'); }
    else if(p.link){ tx=(pos[p.link[0]].x+pos[p.link[1]].x)/2; ty=(pos[p.link[0]].y+pos[p.link[1]].y)/2; }
    pin(p.x,p.y,p.t,tx,ty);
  });
  { const box=document.querySelector('.map');
    if(box.scrollWidth>box.clientWidth){
      const xsC=(c.pins&&c.pins.length)?c.pins.map(p=>p.x):[...on].map(n=>pos[n].x);
      const cx=xsC.reduce((a,b)=>a+b,0)/xsC.length, vb=svg.viewBox.baseVal, pxl=(cx-vb.x)/vb.width*svg.clientWidth;
      const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      box.scrollTo({left:Math.max(0,pxl-box.clientWidth/2),behavior:reduce?'auto':'smooth'}); } }
  // rail
  document.querySelectorAll('#rail .dot').forEach(b=>{ const n=+b.dataset.card;
    b.removeAttribute('aria-current'); if(n===card) b.setAttribute('aria-current','step'); b.classList.toggle('done',n<card); });
  const pv=document.getElementById('prev'), nx=document.getElementById('next');
  pv.disabled = card===1; pv.textContent='Partie précédente';
  nx.disabled = card===SOUT.length;

  document.getElementById('side').innerHTML = c.id==='quiz' ? quizHTML() : c.id==='jour' ? jourHTML(c) : soutHTML(c);

}

function soutHTML(c){
  const pres=SOUT.filter(s=>s.part==='presentation');
  let head;
  if(c.part==='presentation'){
    const i=pres.indexOf(c), start=pres.slice(0,i).reduce((a,s)=>a+s.dur,0);
    head=`<p class="eyebrow">Présentation, partie ${i+1} sur ${pres.length}</p><h2>${c.title}</h2>
      <p class="clock">De ${fmt(start)} à ${fmt(start+c.dur)}, soit ${fmt(c.dur)}</p>`;
  } else head=`<p class="eyebrow">Discussion, dix minutes</p><h2>${c.title}</h2>`;
  const req=`<div class="req"><span>Ce que demande le cahier des charges</span>${c.req}</div>`;
  const pre=c.pre?`<p class="pre"><b>Avant la soutenance.</b> ${c.pre}</p>`:'';
  const show=c.show&&c.show.length?`<h3 class="sub">Ce que tu montres</h3><ol class="acts">${c.show.map(s=>`<li><span class="w">${s.w}</span><code>${s.c}</code></li>`).join('')}</ol>`:'';
  const see=c.see?`<h3 class="sub">Ce que le jury doit voir</h3><p class="say">${c.see}</p>`:'';
  const ver=c.verify?`<p class="verify"><b>À vérifier une fois avant la soutenance :</b> ${c.verify} Je l'ai décrit d'après le comportement standard de Cisco, sans l'avoir vu sur ton écran.</p>`:'';
  const liv=c.livrable?`<p class="pre"><b>Ton livrable 1.</b> ${c.livrable}</p>`:'';
  const pl=c.plan?planHTML():'';
  const say=c.say&&c.say.length?`<h3 class="sub">La phrase à dire</h3>${c.say.map(t=>`<p class="jury">${t}</p>`).join('')}`:'';
  const fix=c.fix?`<h3 class="sub">À corriger à l'oral dans ton document</h3><ul class="fix">${c.fix.map(t=>`<li>${t}</li>`).join('')}</ul>`:'';
  const ecarts=c.ecarts?c.ecarts.map(([a,b,d])=>`<div class="ecart"><p><span>Le cahier des charges demandait</span>${a}</p><p><span>Ce que tu as fait</span>${b}</p><p><span>Ta justification</span>${d}</p></div>`).join(''):'';
  const qa=c.qa&&c.qa.length?`<h3 class="sub">Les questions qui peuvent suivre</h3>${c.qa.map(([q,a],i)=>{
      const open=qaOpen[`${c.id}:${i}`];
      return `<div class="qa"><p class="qq">${q}</p>${open?`<p class="qa-a">${a}</p>`:`<button class="btn small" data-qa="${i}">Réponds d'abord, puis révèle</button>`}</div>`;}).join('')}`:'';
  const tr=(c.trajets||c.loupe!=null)?`<div class="goto">${(c.trajets||[]).map(id=>{const s=SCEN.find(x=>x.id===id);return `<button class="btn small" data-trajet="${id}">Revoir le trajet : ${s.name}</button>`;}).join('')}${c.loupe!=null?`<button class="btn small" data-loupe="${c.loupe}">Voir la trame à la loupe</button>`:''}</div>`:'';
  return head+req+pre+liv+show+pl+see+ver+say+fix+ecarts+qa+tr;
}

function quizHTML(){
  const ok=Object.values(qstate).filter(v=>v==='ok').length, rv=Object.values(qstate).filter(v=>v==='review').length;
  const top=`<p class="eyebrow">Discussion, dix minutes</p><h2>Les questions du jury</h2>`;
  if(qpos>=qorder.length){
    return top+`<p class="say">Série terminée. Tu savais <b>${ok}</b> réponses sur ${QUIZ.length}, et <b>${rv}</b> sont à revoir.</p>
      <div class="goto">${rv?`<button class="btn primary small" id="qreview">Revoir seulement les ${rv} questions à revoir</button>`:''}
      <button class="btn small" id="qall">Tout recommencer</button></div>`;
  }
  const i=qorder[qpos], q=QUIZ[i], open=qaOpen['quiz:'+i];
  return top+`<p class="clock">Question ${qpos+1} sur ${qorder.length}. Je savais : ${ok}. À revoir : ${rv}.</p>
    <div class="flash"><p class="qq big">${q.q}</p>
    ${open?`<p class="qa-a">${q.a}</p><div class="rate"><button class="btn" id="qrv">À revoir</button><button class="btn primary" id="qok">Je savais</button></div>`
          :`<p class="hint2">Réponds à voix haute, comme devant le jury. Puis révèle la réponse.</p><button class="btn primary" id="qshow">Voir la réponse</button>`}
    </div><p class="kbd">Les équipements concernés par la question sont mis en évidence sur la carte.</p>`;
}

function bindSout(c){
  document.querySelectorAll('[data-qa]').forEach(b=>b.addEventListener('click',()=>{qaOpen[`${c.id}:${b.dataset.qa}`]=true;render();}));
  document.querySelectorAll('[data-trajet]').forEach(b=>b.addEventListener('click',()=>{
    mode='trajets'; si=SCEN.findIndex(x=>x.id===b.dataset.trajet); step=0; buildRail(); render();}));
  const g=id=>document.getElementById(id);
  if(g('qshow')) g('qshow').addEventListener('click',()=>{qaOpen['quiz:'+qorder[qpos]]=true;render();});
  const rate=v=>{ qstate[qorder[qpos]]=v; delete qaOpen['quiz:'+qorder[qpos]]; qpos++; render(); };
  if(g('qok')) g('qok').addEventListener('click',()=>rate('ok'));
  if(g('qrv')) g('qrv').addEventListener('click',()=>rate('review'));
  if(g('qreview')) g('qreview').addEventListener('click',()=>{ qorder=Object.keys(qstate).filter(k=>qstate[k]==='review').map(Number); qorder.forEach(i=>delete qstate[i]); qpos=0; render(); });
  if(g('qall')) g('qall').addEventListener('click',()=>{ qstate={}; qorder=[...QUIZ.keys()]; qpos=0; render(); });
}

/* --- chronometre de repetition --- */
let chT0=null, chAcc=0, chInt=null;
const chEl=()=>chAcc+(chT0?(Date.now()-chT0)/1000:0);
function chUpdate(){
  const e=Math.floor(chEl()), mm=String(Math.floor(e/60)).padStart(2,'0'), ss=String(e%60).padStart(2,'0');
  document.getElementById('chT').textContent=`${mm}:${ss}`;
  const pres=SOUT.filter(s=>s.part==='presentation'); let acc=0, cur=pres.length;
  for(let i=0;i<pres.length;i++){ if(e<acc+pres[i].dur){cur=i+1;break;} acc+=pres[i].dur; }
  const h=document.getElementById('chH'); h.className='h';
  if(e>=1200){ h.textContent='Au-delà de 20 minutes : la présentation peut être refusée.'; h.className='h warn'; }
  else if(e>=900) h.textContent='Au-delà de tes 15 minutes prévues : il te reste jusqu\'à 20 minutes au maximum.';
  else if(e===0) h.textContent='Lance-le au début d\'une répétition complète, à voix haute.';
  else h.textContent=`Selon ton minutage, tu devrais être à la partie ${cur} : ${pres[cur-1].title}.`;
  if(!chT0 && e>0 && e<600){ h.textContent='En pause avant 10 minutes : trop court si tu t\'arrêtes là.'; h.className='h warn'; }
}
document.getElementById('chGo').addEventListener('click',()=>{
  const b=document.getElementById('chGo');
  if(chT0){ chAcc=chEl(); chT0=null; clearInterval(chInt); b.textContent='Reprendre'; }
  else { chT0=Date.now(); chInt=setInterval(chUpdate,500); b.textContent='Pause'; }
  chUpdate();
});
document.getElementById('chRz').addEventListener('click',()=>{
  chAcc=0; chT0=null; clearInterval(chInt); document.getElementById('chGo').textContent='Démarrer le chronomètre'; chUpdate(); });
chUpdate();

    {created:1, mac:"0010.1110.EAB0"+AR+"0010.116E.5701", ip:IP_REP, tag:"aucune", chg:[],
     say:"Le serveur répond. Le destinataire n'est pas dans son réseau : il envoie à sa passerelle, le routeur Vert.",
     why:{ip:"destination IP, l'expéditeur qu'il a vu : l'adresse publique du routeur Rouge.", mac:"destination matérielle, sa passerelle, le routeur Vert.", tag:"aucune, le bâtiment Vert n'a pas de VLAN configuré."}},
    {mac:"0010.1110.EAB0"+AR+"0010.116E.5701", ip:IP_REP, tag:"aucune", chg:[],
     say:"Le switch remet la trame au routeur Vert, sans rien modifier.", why:{}},
    {serial:1, mac:SERIE, ip:IP_REP, tag:"aucune", chg:["mac"],
     say:"132.186.32.33 appartient à la liaison Rouge-Bleu. Deux chemins ont le même coût, direct ou par le Bleu : les deux arrivent au Rouge par une liaison série.",
     why:{mac:"liaison série : plus d'adresse matérielle."}},
    {mac:"0001.977A.8E01"+AR+"0002.1747.6A01", ip:IP_BACK, tag:"aucune", chg:["mac","ip"], badge:"Correction 2", nat:"read",
     badgeText:"Tu avais oublié cette étape : le NAT inverse, entre la liste 100 et la route statique.",
     say:"Dans l'ordre : la liste 100 autorise le paquet, le NAT inverse traduit le destinataire, puis la route statique l'envoie au cœur, 192.168.99.2.",
     why:{ip:"le NAT retrouve la ligne de l'aller grâce au port 1025, et rend au poste son adresse.", mac:"le Rouge a routé : nouvelle trame Ethernet, vers le cœur."}},
    {mac:"0001.6346.6004"+AR+"00E0.B0DD.9C65", ip:IP_BACK, tag:"VLAN 40", chg:["mac","tag"],
     say:"Le réseau 192.168.40.0 est branché sur l'interface Vlan40 du cœur.",
     why:{mac:"le cœur a routé : nouvelle trame, de son interface Vlan40 vers le poste.", tag:"le poste est dans le VLAN 40 : la trame part étiquetée sur le trunk."}},
    {mac:"0001.6346.6004"+AR+"00E0.B0DD.9C65", ip:IP_BACK, tag:"aucune", chg:["tag"],
     say:"La distribution transmet, puis SW-FINANCE remet la trame au poste.",
     why:{tag:"le port du poste est en access : le switch retire l'étiquette."}}
   ]}
];
const FL={mac:"Adresses matérielles",ip:"Adresses IP",tag:"Étiquette"};
let lphase=0, lstep=0, layer='all', lguess=false;
const lanswers={};
try{ const v=JSON.parse(localStorage.getItem('trajet-v5l')||'{}');
  if(v.lphase>=0&&v.lphase<3) lphase=v.lphase;
  if(v.lstep>=0&&v.lstep<=LOUPE[lphase].links.length) lstep=v.lstep;
  if(['all','tag','ip','mac'].includes(v.layer)) layer=v.layer; lguess=!!v.lguess; }catch(e){}
const saveL=()=>{ try{localStorage.setItem('trajet-v5l',JSON.stringify({lphase,lstep,layer,lguess}));}catch(e){} };
const LP=()=>LOUPE[lphase];
const loupeSvg=document.getElementById('loupe');
function lel(t,a,p){ const e=document.createElementNS("http://www.w3.org/2000/svg",t); for(const k in a) e.setAttribute(k,a[k]); (p||loupeSvg).appendChild(e); return e; }
function ltx(x,y,s,a,p){ const t=lel('text',Object.assign({x,y},a||{}),p); t.textContent=s; return t; }
function wrapTxt(s,n){ const out=[]; let cur=''; s.split(' ').forEach(w=>{ if(((cur?cur+' ':'')+w).length>n && cur){ out.push(cur); cur=w; } else cur=cur?cur+' '+w:w; }); if(cur) out.push(cur); return out; }
const needGuess=L=>!L.created;
const isOpen=k=>{ const L=LP().links[k-1]; return k<lstep || (k===lstep && !(lguess && needGuess(L) && !lanswers[lphase+':'+k])); };
function whyList(L){ return ['mac','ip','tag'].filter(k=>L.why[k] && (layer==='all'||layer===k)).map(k=>[k,L.why[k]]); }

function renderLoupeSvg(){
  const P=LP(); loupeSvg.innerHTML='';
  const C=document.querySelector('.map').clientWidth<600;
  const W=C?380:760, NH=C?50:56, XN=C?40:170, WN=C?300:210, XA=C?56:275, XC=C?72:400, WC=C?300:350;
  const XL=C?82:XC+20, XV=C?118:XC+62, WRAP=C?44:50, ZH=C?24:0;
  const nodeY=[], linkY=[], linkH=[], cardH=[], linkPad=[];
  const zoneStart=new Set(P.zones.map(z=>z[0]));
  let y=C?6:14;
  P.nodes.forEach((n,i)=>{
    if(C && zoneStart.has(i)) y+=ZH;
    nodeY[i]=y; y+=NH;
    if(i<P.links.length){
      const k=i+1, L=P.links[i];
      let h=60 + (C && L.badge && k<=lstep && isOpen(k) ? 18 : 0);
      if(k===lstep && isOpen(k)){ const lines=whyList(L).reduce((a,[f,t])=>a+wrapTxt(FL[f]+" : "+t,WRAP).length,0); if(lines) h+=10+lines*15; }
      linkPad[i]=(C && P.wan===i)?22:0;
      cardH[i]=h; linkY[i]=y; linkH[i]=Math.max(C?70:76,h+16)+linkPad[i]; y+=linkH[i];
    }
  });
  const H=y+14;
  loupeSvg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  P.zones.forEach(([a,b,label])=>{
    const top=nodeY[a]-8-ZH, bot=nodeY[b]+NH+8;
    lel('rect',{x:4,y:top,width:W-8,height:bot-top,rx:12,class:'lz '+(label.startsWith('Siège')?'zr':'zv')});
    if(C) ltx(14,top+17,label,{class:'lzl'});
    else label.split(', ').forEach((t,j,arr)=>ltx(18,top+18+16*j,t+(j<arr.length-1?',':''),{class:'lzl'}));
  });
  if(P.wan!=null){ const i=P.wan, top=linkY[i]+(C?4:10), h=linkH[i]-(C?8:20);
    lel('rect',{x:4,y:top,width:W-8,height:h,rx:10,class:'lz zw'});
    if(C) ltx(14,top+16,"Entre les bâtiments",{class:'lzl'});
    else { ltx(18,top+h/2-4,"Entre les",{class:'lzl'}); ltx(18,top+h/2+12,"bâtiments",{class:'lzl'}); } }
  const actor = lstep>0 ? lstep-1 : -1;
  P.nodes.forEach(([t,sub,l3],i)=>{
    const g=lel('g',{class:'ln'+(l3?' l3':'')+(i===actor?' cur':'')});
    lel('rect',{x:XN,y:nodeY[i],width:WN,height:NH,rx:8},g);
    ltx(XN+WN/2,nodeY[i]+(C?20:22),t,{'text-anchor':'middle',class:'lnt'},g);
    ltx(XN+WN/2,nodeY[i]+(C?37:40),sub,{'text-anchor':'middle',class:'lns'},g);
  });
  P.links.forEach((L,i)=>{
    const k=i+1, y1=nodeY[i]+NH+4, y2=nodeY[i+1]-(C&&zoneStart.has(i+1)?ZH:0)-5;
    lel('line',{x1:XA,y1,x2:XA,y2:y2-8,class:'la'+(L.serial?' ser':'')});
    lel('polygon',{points:`${XA},${y2} ${XA-6},${y2-9} ${XA+6},${y2-9}`,class:'lah'+(L.serial?' ser':'')});
    const h=cardH[i], top=linkY[i]+linkPad[i]+(linkH[i]-linkPad[i]-h)/2;
    if(k>lstep){ lel('rect',{x:XC,y:top,width:WC,height:h,rx:8,class:'lcard fut'}); ltx(XC+WC/2,top+h/2+5,"?",{'text-anchor':'middle',class:'lq'}); return; }
    if(!isOpen(k)){
      lel('rect',{x:XC,y:top,width:WC,height:h,rx:8,class:'lcard ask'});
      ltx(XC+WC/2,top+h/2+5,"À toi : que change ce lien ?",{'text-anchor':'middle',class:'lqa'});
      if(!C) lel('line',{x1:XA+8,y1:top+h/2,x2:XC,y2:top+h/2,class:'lleader'});
      return;
    }
    if(!C) lel('line',{x1:XA+8,y1:top+30,x2:XC,y2:top+30,class:'lleader'});
    lel('rect',{x:XC,y:top,width:WC,height:h,rx:8,class:'lcard'+(k===lstep?' now':'')});
    let ry0=top+15;
    if(L.badge){
      if(C){ ltx(XL,top+16,L.badge,{class:'lbadget'}); ry0+=18; }
      else { const bg=lel('g',{class:'lbadge'}); lel('rect',{x:XN,y:top+19,width:96,height:22,rx:5},bg); ltx(XN+48,top+34,L.badge,{'text-anchor':'middle'},bg); }
    }
    [['mac','MAC',L.mac],['ip','IP',L.ip],['tag','Étiq.',L.tag]].forEach(([key,lab,val],r)=>{
      const ry=ry0+15*r, g=lel('g',{class:'lrow'+(layer!=='all'&&layer!==key?' dim':'')});
      if(L.chg.includes(key)) lel('circle',{cx:XC+(C?8:10),cy:ry,r:3.2,class:'ldot'},g);
      ltx(XL,ry+4,lab,{class:'llab'},g);
      if(key==='tag'&&val.startsWith('VLAN')){ lel('rect',{x:XV,y:ry-8,width:70,height:16,rx:4,class:'lchip'},g); ltx(XV+35,ry+4,val,{'text-anchor':'middle',class:'lchipt'},g); }
      else ltx(XV,ry+4,val,{class:'lval'+(C?' sm':'')},g);
    });
    if(k===lstep){
      let wy=ry0+57;
      whyList(L).forEach(([f,t])=>{
        wrapTxt(FL[f]+" : "+t,WRAP).forEach((line,li)=>{
          const tt=lel('text',{x:XC+(C?10:14),y:wy,class:'lwhy'});
          if(li===0){ const cut=line.indexOf(' : '); const b=document.createElementNS("http://www.w3.org/2000/svg",'tspan'); b.setAttribute('class','lwhyb'); b.textContent=line.slice(0,cut+2); tt.appendChild(b); tt.appendChild(document.createTextNode(line.slice(cut+2))); }
          else tt.textContent=line;
          wy+=15;
        });
      });
    }
  });
}

function natHTML(){
  const Lc=lstep>0?LP().links[lstep-1]:null, pend=Lc&&lguess&&needGuess(Lc)&&!lanswers[lphase+':'+lstep];
  const lstep_=lstep; { const lstep=pend?lstep_-1:lstep_; return natInner(lstep); }
}
function natInner(lstep){
  const box=inner=>`<div class="nat"><h3>Table NAT du routeur Rouge</h3>${inner}</div>`;
  if(lphase===0) return box(`<p class="note">Le NAT n'intervient pas ici : la requête ne quitte jamais le siège.</p>`);
  const row=cls=>`<div class="natrow${cls}"><span class="nk">Intérieur</span><code>192.168.40.11:1025</code><span class="nk">correspond à</span><span class="nk">Extérieur</span><code>132.186.32.33:1025</code></div>`;
  if(lphase===1){
    if(lstep<3) return box(`<p class="note">Vide pour l'instant. Le routeur Rouge écrira une ligne au passage de la requête.</p>`);
    if(lstep===3) return box(row(' new')+`<p class="note">Ligne écrite à l'instant. Le Rouge s'en servira pour reconnaître la réponse.</p>`);
    return box(row(''));
  }
  if(lstep<4) return box(row('')+`<p class="note">La ligne écrite à l'aller attend la réponse.</p>`);
  if(lstep===4) return box(row(' read')+`<p class="note">Ligne retrouvée grâce au port 1025 : le destinataire redevient 192.168.40.11.</p>`);
  return box(row(''));
}

function loupeHTML(){
  const P=LP(), N=P.links.length;
  const lay=`<div class="layers" role="group" aria-label="Une notion à la fois"><span class="laylab">Une notion à la fois</span>${[['all','Tout'],['tag','Étiquette'],['ip','Adresses IP'],['mac','Adresses matérielles']].map(([k,t])=>`<button class="lay" data-lay="${k}" aria-pressed="${layer===k}">${t}</button>`).join('')}</div>`;
  let body='';
  if(lstep===0) body=`<p class="say">${P.lead}</p><p class="note">${P.note}</p><p class="kbd">Avance lien par lien avec « Étape suivante ». Active le mode devine pour répondre avant de voir chaque fiche.</p>`;
  else{
    const L=P.links[lstep-1], key=lphase+':'+lstep, ans=lanswers[key], pending=lguess&&needGuess(L)&&!ans;
    body=`<h3 class="sub">${P.nodes[lstep-1][0]}, vers ${P.nodes[lstep][0]}</h3>`+(pending?`<p class="say hint2">Regarde l'équipement qui vient d'agir, et le câble qu'emprunte la trame. Ce qu'il fait te sera expliqué après ta réponse.</p>`:`<p class="say">${L.say}</p>`);
    if(pending){
      body+=`<div class="quiz"><h3>À toi : que change ce lien ?</h3><p class="hint">Compare avec la fiche du lien précédent. Si rien ne change, ne coche rien.</p>${['mac','ip','tag'].map(k=>`<label class="opt"><input type="checkbox" value="${k}"> ${FL[k]}</label>`).join('')}<button class="btn primary" id="lcheck">Vérifier ma réponse</button></div>`;
    } else {
      if(ans){ const good=new Set(L.chg), pick=new Set(ans.picked);
        const miss=[...good].filter(k=>!pick.has(k)).map(k=>FL[k]), extra=[...pick].filter(k=>!good.has(k)).map(k=>FL[k]);
        body+= ans.ok?`<p class="verdict ok">Exact.${good.size?'':' Rien ne change sur ce lien.'}</p>`
          :`<p class="verdict ko">Pas tout à fait.${miss.length?` Tu as oublié : ${miss.join(', ')}.`:''}${extra.length?` En trop : ${extra.join(', ')}.`:''}</p><button class="btn" id="lretry">Réessayer ce lien</button>`; }
      if(!L.created && L.chg.length===0) body+=`<p class="note">Rien ne change sur ce lien : la fiche est identique à la précédente.</p>`;
      if(L.badge) body+=`<p class="pre"><b>${L.badge}.</b> ${L.badgeText}</p>`;
      body+=`<p class="kbd">Le pourquoi de chaque changement est écrit sous la fiche, sur le schéma.</p>`;
    }
  }
  const end= lstep===N ? `<div class="recap"><h3>Fin de la phase</h3><p class="say">${P.end}</p></div>` : '';
  const go = P.trajet ? `<div class="goto"><button class="btn small" data-trajet="${P.trajet}">Revoir ce trajet sur la carte de ta maquette</button></div>` : '';
  return `<p class="eyebrow">La trame à la loupe, phase ${lphase+1} sur 3</p><h2>${P.name}</h2><p class="clock">${lstep===0?'Avant le départ':`Lien ${lstep} sur ${N}`}</p>${lay}${body}${natHTML()}${end}${go}`;
}

function bindLoupe(){
  document.querySelectorAll('[data-lay]').forEach(b=>b.addEventListener('click',()=>{ layer=b.dataset.lay; saveL(); render(); }));
  const c=document.getElementById('lcheck');
  if(c) c.addEventListener('click',()=>{ const L=LP().links[lstep-1];
    const picked=[...document.querySelectorAll('.quiz input:checked')].map(i=>i.value), good=new Set(L.chg);
    lanswers[lphase+':'+lstep]={picked, ok:picked.length===good.size&&picked.every(k=>good.has(k))}; render(); });
  const r=document.getElementById('lretry');
  if(r) r.addEventListener('click',()=>{ delete lanswers[lphase+':'+lstep]; render(); });
  document.querySelectorAll('#side [data-trajet]').forEach(b=>b.addEventListener('click',()=>{
    mode='trajets'; si=SCEN.findIndex(x=>x.id===b.dataset.trajet); step=0; buildRail(); render(); }));
}

const ltabs=document.getElementById('ltabs');
LOUPE.forEach((P,i)=>{ const b=document.createElement('button'); b.className='tab'; b.textContent=P.tab;
  b.addEventListener('click',()=>{ lphase=i; lstep=0; buildLoupeRail(); render(); }); ltabs.appendChild(b); });
function buildLoupeRail(){
  const rail=document.getElementById('rail'); rail.innerHTML='';
  const w=document.createElement('div'); w.className='leg';
  const l=document.createElement('span'); l.className='leg-name'; l.textContent='Liens'; w.appendChild(l);
  for(let k=0;k<=LP().links.length;k++){ const b=document.createElement('button'); b.className='dot'; b.dataset.lstep=k;
    b.textContent=k===0?'0':String(k); b.setAttribute('aria-label',k===0?'Départ':`Lien ${k}`);
    b.addEventListener('click',()=>{ lstep=k; render(); }); w.appendChild(b); }
  rail.appendChild(w);
}
function buildCurrentRail(){ if(mode==='sout') buildSoutRail(); else if(mode==='loupe') buildLoupeRail(); else buildRail(); }
function loupeGo(n){
  const N=LP().links.length;
  if(n>N){ if(lphase<LOUPE.length-1){ lphase++; lstep=0; buildLoupeRail(); } else lstep=N; }
  else if(n<0){ if(lphase>0){ lphase--; lstep=LP().links.length; buildLoupeRail(); } else lstep=0; }
  else lstep=n;
  render();
}
function renderLoupe(){
  document.querySelectorAll('#ltabs .tab').forEach((b,i)=>b.setAttribute('aria-pressed',i===lphase?'true':'false'));
  const tb=document.getElementById('train'); tb.setAttribute('aria-pressed',lguess?'true':'false'); tb.textContent=lguess?'Mode devine activé':'Mode devine';
  renderLoupeSvg();
  document.querySelectorAll('#rail .dot').forEach(b=>{ const n=+b.dataset.lstep; b.removeAttribute('aria-current'); if(n===lstep) b.setAttribute('aria-current','step'); b.classList.toggle('done',n<lstep); });
  const N=LP().links.length, pv=document.getElementById('prev'), nx=document.getElementById('next');
  pv.disabled = lphase===0 && lstep===0; pv.textContent='Étape précédente';
  nx.disabled = lphase===LOUPE.length-1 && lstep===N;
  nx.textContent = lstep===0 ? 'Commencer la phase' : (lstep===N ? 'Phase suivante' : 'Étape suivante');
  document.getElementById('side').innerHTML=loupeHTML(); bindLoupe(); saveL();
  const box=document.querySelector('.map'), cur=loupeSvg.querySelector('.lcard.now, .lcard.ask');
  if(cur){ const br=cur.getBoundingClientRect(), bx=box.getBoundingClientRect();
    if(br.top<bx.top || br.bottom>bx.bottom) box.scrollTop += (br.top-bx.top) - (box.clientHeight-br.height)/2; }
  else if(lstep===0) box.scrollTop=0;
}
document.getElementById('side').addEventListener('click',e=>{ const b=e.target.closest('[data-loupe]'); if(!b) return;
  mode='loupe'; lphase=+b.dataset.loupe; lstep=0; buildLoupeRail(); render(); });
['vlan','internet','web'].forEach((id,i)=>{ const c=SOUT.find(x=>x.id===id); if(c) c.loupe=[0,1,1][i]; });
QUIZ.forEach((_,i)=>{ if(!qorder.includes(i) && !(i in qstate)) qorder.push(i); });

window.addEventListener('resize',()=>{ if(mode==='loupe') renderLoupeSvg(); });
buildCurrentRail(); render();

</script>
</body>
